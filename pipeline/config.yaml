# Daily airport-level dataset (one row = one airport-day). All inputs are public.
dataset_version: de_airports_daily_v1
date_start: '2014-01-01'          # first day with EUROCONTROL daily airport data
date_end_exclusive: '2026-01-01'  # DWD historical archive ends 2025-12-31
# Airports with a DWD synoptic station at the airport (IDs verified against DWD station inventories).
airports:
  - {icao: EDDF, name: Frankfurt,        dwd_station: '01420', lat: 50.0333, lon: 8.5706}
  - {icao: EDDM, name: Munich,           dwd_station: '01262', lat: 48.3538, lon: 11.7861}
  - {icao: EDDL, name: Duesseldorf,      dwd_station: '01078', lat: 51.2895, lon: 6.7668}
  - {icao: EDDH, name: Hamburg,          dwd_station: '01975', lat: 53.6304, lon: 9.9882}
  - {icao: EDDK, name: Cologne-Bonn,     dwd_station: '02667', lat: 50.8659, lon: 7.1427}
  - {icao: EDDS, name: Stuttgart,        dwd_station: '04931', lat: 48.6899, lon: 9.2220}
  - {icao: EDDP, name: Leipzig-Halle,    dwd_station: '02932', lat: 51.4324, lon: 12.2416}
  - {icao: EDDV, name: Hannover,         dwd_station: '02014', lat: 52.4611, lon: 9.6851}
  - {icao: EDDN, name: Nuremberg,        dwd_station: '03668', lat: 49.4987, lon: 11.0780}
  - {icao: EDDW, name: Bremen,           dwd_station: '00691', lat: 53.0475, lon: 8.7867}
  - {icao: EDDC, name: Dresden,          dwd_station: '01048', lat: 51.1328, lon: 13.7672}
  - {icao: EDDG, name: Muenster-Osnabrueck, dwd_station: '01766', lat: 52.1346, lon: 7.6848}
dwd_products: [TU, FF, RR, VV, FX, WW]
min_valid_hours: 20               # daily weather aggregate is null below this many valid hours
max_station_distance_km: 10       # sanity check: station must be at the airport
targets:
  disrupted_share_15: 0.02        # disrupted_day = share of arrivals ATFM-delayed >15 min >= 2%
  severe_share_15: 0.10           # severe_disrupted_day threshold
splits:                            # by date, inclusive start / exclusive end
  train:        ['2014-01-01', '2022-01-01']
  model_select: ['2022-01-01', '2023-01-01']
  calibrate:    ['2023-01-01', '2024-01-01']
  test:         ['2024-01-01', '2026-01-01']
paths:
  raw_eurocontrol_public: data/raw/eurocontrol
  raw_dwd: data/raw/dwd
  processed: data/processed
  metadata: data
